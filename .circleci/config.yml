version: 2.1
workflows:
  build_and_deploy:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/
      - deploy:
          requires:
            - build
          filters:
            tags:
              only: /[0-9]+(\.(?:dev)?[0-9]+)*/
            branches:
              ignore: /.*/

jobs:
  build:
    docker:
      # specify the version you desire here
      - image: cimg/python:3.14.6

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install --yes libgl1

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v2-dependencies-{{ checksum "setup.py" }}-{{ checksum "pyproject.toml" }}
          # fallback to using the latest cache if no exact match is found
          - v2-dependencies-

      # install dependencies
      - run:
          name: install dependencies
          command: |
            python3 -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install '.[ui,test,publish]'

      # run tests!
      - run:
          name: run tests
          command: |
            . .venv/bin/activate
            tox -e py314

      - run:
          name: Validate distribution packages
          command: |
            . .venv/bin/activate
            python -m build
            python -m twine check --strict dist/*

      - save_cache:
          paths:
            - ./.venv
            - ./.tox
            - .coverage
          key: v2-dependencies-{{ checksum "setup.py" }}-{{ checksum "pyproject.toml" }}

      # - run:
      #     name: Generate reports
      #     command: |
      #       . .venv/bin/activate
      #       coverage report
      #       mkdir test-reports
      #       mkdir test-reports/coverage
      #       coverage html -d test-reports/coverage

      - store_artifacts:
          path: test-reports
          destination: test-reports

  deploy:
    docker:
      - image: cimg/python:3.14.6
    steps:
      - checkout
      # Download and cache dependencies
      - restore_cache:
          keys:
          - v2-dependencies-{{ checksum "setup.py" }}-{{ checksum "pyproject.toml" }}
          # fallback to using the latest cache if no exact match is found
          - v2-dependencies-

      # install dependencies
      - run:
          name: install dependencies
          command: |
            python3 -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install '.[publish]'

      - run:
          name: Build packages
          command: |
            . .venv/bin/activate
            python -m build
            python -m twine check --strict dist/*
      
      - run:
          name: Initialise .pypirc
          command: |
            echo -e "[pypi]" >> ~/.pypirc
            echo -e "repository = $PYPI_REPOSITORY" >> ~/.pypirc
            echo -e "username = __token__" >> ~/.pypirc
            echo -e "password = pypi-$PYPI_APITOKEN" >> ~/.pypirc
      
      - run:
          name: Upload package
          command: |
            . .venv/bin/activate
            python -m twine upload dist/*
